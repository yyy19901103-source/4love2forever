name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test CLI
        run: python mermaid_scheduler.py sample.mmd --start-date 2026-04-01 --max-parallel 2 --json

  quality-kit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quality-kit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type check and tests (coverage 100%)
        run: npm test

      - name: Smoke test CLI
        run: node src/bin.ts sample/measurements.csv --lsl 9.9 --usl 10.1
